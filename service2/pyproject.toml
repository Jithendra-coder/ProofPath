[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpath-service2"
version = "0.1.0"
description = "Proofpath assessment execution service"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["service2", "service2.app"]
package-dir = { service2 = "." }
