[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpath-service1"
version = "0.1.0"
description = "Proofpath identity, profile, and portfolio service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "email-validator>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools]
packages = ["service1", "service1.app"]
package-dir = { service1 = "." }
