[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpath-candidate-api"
version = "0.1.0"
description = "Proofpath candidate identity, resume, profile, and portfolio API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "email-validator>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<7.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools]
packages = ["candidate_api", "candidate_api.app"]
package-dir = { candidate_api = "." }
