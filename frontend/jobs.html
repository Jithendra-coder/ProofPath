<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Find jobs · Proofpath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; font: 16px/1.55 Inter, sans-serif; color: #111827; background: #f8f9ff; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px max(24px, calc((100vw - 1040px) / 2)); background: #fff; border-bottom: 1px solid #e5e7eb; }
      .brand { color: inherit; text-decoration: none; font: 700 22px Manrope, sans-serif; letter-spacing: -.04em; }
      .brand span { color: #a62a16; }
      nav { display: flex; gap: 16px; }
      nav a, a { color: #0f3d3e; font-weight: 600; }
      main { width: min(100% - 32px, 1040px); margin: 42px auto; }
      h1, h2, h3 { font-family: Manrope, sans-serif; letter-spacing: -.035em; }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 40px); }
      h2 { margin: 0 0 16px; font-size: 24px; }
      h3 { margin: 0; font-size: 20px; }
      p { color: #5a6573; }
      .intro { margin: 8px 0 24px; }
      .search { width: 100%; max-width: 520px; min-height: 48px; padding: 11px 13px; border: 1px solid #c6cdd3; border-radius: 8px; font: inherit; }
      .search:focus, button:focus-visible, a:focus-visible { outline: 2px solid #0f3d3e; outline-offset: 2px; }
      .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; margin-top: 24px; }
      .panel, .job { padding: 22px; border: 1px solid #e5e7eb; border-radius: 14px; background: white; }
      .job { margin-bottom: 14px; }
      .job header { padding: 0; border: 0; }
      .company { margin: 5px 0 12px; color: #0f3d3e; font-weight: 600; }
      .job-description { white-space: pre-wrap; }
      button { min-height: 40px; padding: 9px 13px; border: 0; border-radius: 8px; background: #a62a16; color: white; font: 600 14px Inter, sans-serif; cursor: pointer; }
      button.secondary { background: #eaf6f2; color: #174b49; }
      button:disabled { opacity: .65; cursor: wait; }
      .message { min-height: 24px; }
      .message[data-kind="error"] { color: #b42318; }
      .saved-job { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #e5e7eb; }
      .saved-job a { display: block; }
      .closed { color: #92400e; font-size: 12px; font-weight: 700; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Proofpath<span>.</span></a>
      <nav aria-label="Primary"><a href="/candidate/onboarding">Candidate workspace</a><a href="/projects">Projects</a><a href="/applications">My applications</a><a href="/login">Sign in</a></nav>
    </header>
    <main>
      <h1>Find work that shows what you can do.</h1>
      <p class="intro">Browse jobs published by Proofpath organization workspaces.</p>
      <label for="search">Search published jobs</label>
      <input id="search" class="search" type="search" autocomplete="off" placeholder="Search titles, organizations, or descriptions" />
      <div class="grid">
        <section aria-labelledby="jobs-title">
          <h2 id="jobs-title">Published jobs</h2>
          <p id="jobs-status" class="message" role="status" aria-live="polite">Loading jobs…</p>
          <div id="jobs-list"></div>
        </section>
        <aside class="panel" aria-labelledby="saved-title">
          <h2 id="saved-title">Saved jobs</h2>
          <p id="saved-status" class="message" role="status" aria-live="polite">Sign in to see saved jobs.</p>
          <div id="saved-list"></div>
        </aside>
      </div>
    </main>
    <script>
      const jobsStatus = document.querySelector("#jobs-status");
      const jobsList = document.querySelector("#jobs-list");
      const savedStatus = document.querySelector("#saved-status");
      const savedList = document.querySelector("#saved-list");
      let jobs = [];
      let saved = new Set();

      async function api(method, path) {
        const csrf = document.cookie.split("; ").find((part) => part.startsWith("__Host-proofpath_csrf="))?.split("=").slice(1).join("=") || "";
        const response = await fetch(path, {
          method,
          credentials: "same-origin",
          ...(method !== "GET" ? { headers: { "X-CSRF-Token": csrf } } : {}),
        });
        const result = response.status === 204 ? null : await response.json();
        if (!response.ok) throw Object.assign(new Error(result?.detail || "The request could not be completed."), { status: response.status });
        return result;
      }

      function renderJobs() {
        const query = document.querySelector("#search").value.trim().toLowerCase();
        jobsList.replaceChildren();
        const visible = jobs.filter((job) => `${job.title} ${job.organization_name} ${job.description} ${job.competency_requirements.map((item) => item.competency_name).join(" ")}`.toLowerCase().includes(query));
        if (!visible.length) {
          const empty = document.createElement("p");
          empty.textContent = query ? "No published jobs match that search." : "No jobs have been published yet.";
          jobsList.append(empty);
          return;
        }
        for (const job of visible) {
          const card = document.createElement("article");
          card.className = "job";
          const heading = document.createElement("h3");
          const link = document.createElement("a");
          link.href = `/jobs/${encodeURIComponent(job.id)}`;
          link.textContent = job.title;
          heading.append(link);
          const company = document.createElement("p");
          company.className = "company";
          company.textContent = job.organization_name;
          const description = document.createElement("p");
          description.textContent = job.description;
          const requirements = document.createElement("p");
          requirements.textContent = job.competency_requirements.length
            ? `Evidence requirements: ${job.competency_requirements.map((item) => `${item.competency_name} · ${item.target_level}`).join(", ")}`
            : "No structured competency requirements listed.";
          const save = document.createElement("button");
          save.type = "button";
          save.className = "secondary";
          save.textContent = saved.has(job.id) ? "Remove saved job" : "Save job";
          save.addEventListener("click", async () => {
            save.disabled = true;
            try {
              if (saved.has(job.id)) {
                await api("DELETE", `/api/v1/me/saved-jobs/${job.id}`);
                saved.delete(job.id);
              } else {
                await api("PUT", `/api/v1/me/saved-jobs/${job.id}`);
                saved.add(job.id);
              }
              renderJobs();
              await loadSavedJobs();
            } catch (error) {
              savedStatus.dataset.kind = "error";
              savedStatus.textContent = error.status === 401 ? "Sign in to save jobs." : error.message;
              save.disabled = false;
            }
          });
          card.append(heading, company, description, requirements, save);
          jobsList.append(card);
        }
      }

      async function loadSavedJobs() {
        try {
          const result = await api("GET", "/api/v1/me/saved-jobs");
          saved = new Set(result.jobs.map((job) => job.id));
          savedList.replaceChildren();
          for (const job of result.jobs) {
            const row = document.createElement("div");
            row.className = "saved-job";
            const title = document.createElement("div");
            const link = document.createElement("a");
            link.href = `/jobs/${encodeURIComponent(job.id)}`;
            link.textContent = job.title;
            title.append(link, document.createTextNode(job.organization_name));
            if (job.status !== "published") {
              const closed = document.createElement("span");
              closed.className = "closed";
              closed.textContent = "Closed";
              title.append(closed);
            }
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "secondary";
            remove.textContent = "Remove";
            remove.addEventListener("click", async () => {
              await api("DELETE", `/api/v1/me/saved-jobs/${job.id}`);
              saved.delete(job.id);
              await loadSavedJobs();
              renderJobs();
            });
            row.append(title, remove);
            savedList.append(row);
          }
          savedStatus.dataset.kind = "success";
          savedStatus.textContent = result.jobs.length ? `${result.jobs.length} saved` : "You have no saved jobs.";
        } catch (error) {
          savedStatus.textContent = error.status === 403 ? "Open your candidate workspace to save jobs." : "Sign in to see saved jobs.";
        }
        renderJobs();
      }

      async function loadJobs() {
        try {
          const result = await api("GET", "/api/v1/jobs");
          jobs = result.jobs;
          jobsStatus.textContent = `${jobs.length} published job${jobs.length === 1 ? "" : "s"}`;
          renderJobs();
        } catch {
          jobsStatus.dataset.kind = "error";
          jobsStatus.textContent = "Could not load jobs. Try again later.";
        }
      }

      document.querySelector("#search").addEventListener("input", renderJobs);
      Promise.all([loadJobs(), loadSavedJobs()]);
    </script>
  </body>
</html>
