<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <title>Verify your email · Proofpath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <main class="layout">
      <section class="form-panel" aria-labelledby="page-title">
        <a class="brand" href="/" aria-label="Proofpath home">Proofpath<span>.</span></a>
        <div class="content">
          <h1 id="page-title">Verify your email</h1>
          <p class="intro">Confirming your address helps protect your account.</p>
          <p class="message" id="message" role="status" aria-live="polite">Checking your verification link…</p>
          <p id="next-link" hidden><a class="text-link" href="/login">Continue to sign in</a></p>
          <p class="hint"><a class="text-link" href="/signup">Request a fresh verification link</a></p>
        </div>
      </section>
      <aside class="aside" aria-label="About Proofpath">
        <div class="aside-copy">
          <span class="eyebrow">Work over resume</span>
          <h2>Real skills.<br />Real opportunities.</h2>
          <p>Build a professional profile around evidence of the work you have done.</p>
        </div>
      </aside>
    </main>
    <script>
      const message = document.querySelector("#message");
      const nextLink = document.querySelector("#next-link");
      function verifyFromLink() {
        const token = new URLSearchParams(window.location.hash.slice(1)).get("token");
        if (!token) return;
        history.replaceState(null, "", "/verify-email");
        fetch("/api/v1/auth/email-verifications/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        }).then(async (response) => {
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "This verification link is invalid or expired.");
          message.dataset.kind = "success";
          message.textContent = "Your email is verified. You can now sign in.";
          nextLink.hidden = false;
        }).catch((error) => {
          message.dataset.kind = "error";
          message.textContent = error.message || "Could not reach Proofpath. Try again.";
          nextLink.hidden = false;
        });
      }

      window.addEventListener("hashchange", verifyFromLink);
      if (window.location.hash) {
        verifyFromLink();
      } else {
        message.dataset.kind = "error";
        message.textContent = "This verification link is invalid or expired. Request a fresh one to continue.";
        nextLink.hidden = false;
      }
    </script>
  </body>
</html>
