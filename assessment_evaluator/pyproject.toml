[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpath-assessment-evaluator"
version = "0.1.0"
description = "Proofpath deterministic assessment evaluator"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["assessment_evaluator", "assessment_evaluator.app"]
package-dir = { assessment_evaluator = "." }
